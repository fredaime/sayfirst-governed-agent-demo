# SPDX-License-Identifier: Apache-2.0
#
# The gate, run by a machine. Every check it runs is `scripts/gate.sh`, with ONE stated
# exception below — the sign-off check, which runs on a pull request and reads the commits of
# the change against the ref it started from, a range no run on a machine has to be given.
# Apart from it, what a contributor runs locally is what decides a merge; a step that exists
# only here is a step nobody can reproduce, and `tests/test_gate_modes.py` fails if this file
# grows a second one.
#
# This workflow publishes nothing. This demonstration is cloned and run rather than
# installed from an index, so there is no distribution for a release job to publish and
# adding one would be a decision about publishing rather than a convenience.
#
# Two limitations, stated rather than hidden.
#
# The three distributions this repository is built on are published on no index yet. That is
# why the full gate still builds them from a checkout of each rather than installing them:
# when they do reach an index, both checkouts below become an ordinary install, and
# `docs/publication-checklist.md` is the page that says so. What publication already
# changed is WHICH checkout and HOW it is reached — both are this project's own public
# repositories, read at the tag of the release this demonstration shows, with no credential:
#
#   fredaime/sayfirst-control-plane   at v0.3.0   the contract, the boundary, the server
#   fredaime/sayfirst-cli             at v0.3.0   the command a person answers with
#
# Those names are lines of this file now. They were repository variables while they were not
# this repository's to publish; they are public addresses a reader can open, the tag is the
# one number the project file pins, and `tests/test_gate_modes.py` reads both out of this
# file and the tag out of `pyproject.toml` so the three cannot drift apart.
#
# What happens when neither name answers at that tag is the ordinary case rather than a
# crash: this repository is published AFTER the two products it pins, so a run made before
# that day — and a fork on a runner that cannot reach them — finds nothing there. An absence
# is a fact about the world. So this workflow renders three outcomes and not two:
#
#   gate (full)                      everything was built from the two public checkouts and
#                                    every check ran. `scripts/gate.sh` exits 0.
#   gate (reduced — the open         neither product answers at the tag, or only one does.
#   distributions are absent,        Format, lint and every check that needs nothing ran;
#   some checks not run)             the rest are named and counted in the job's summary and
#                                    in an annotation. `scripts/gate.sh` exits 75. The tick
#                                    is green and the job says, in its own name, what it did
#                                    not prove.
#   failure                          anything else — including a full job whose gate came
#                                    back reduced, and a reduced job whose gate came back
#                                    full.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Asked once, before any checkout, and with no credential to ask about: both addresses are
  # public. What is asked is whether the tag this project pins exists at each of them, which
  # is answerable anonymously and is the thing the two checkouts below depend on. Only the
  # answer crosses into a job: this question reads nothing it could leak.
  reachable:
    name: are both products readable at the tag
    runs-on: ubuntu-latest
    outputs:
      answer: ${{ steps.look.outputs.answer }}
    steps:
      - id: look
        env:
          plane: https://github.com/fredaime/sayfirst-control-plane
          client: https://github.com/fredaime/sayfirst-cli
          tag: v0.3.0
        run: |
          answered=yes
          for address in "$plane" "$client"; do
            if [ -z "$(git ls-remote --tags "$address" "refs/tags/$tag" 2>/dev/null)" ]; then
              echo "$address answers with no $tag." >> "$GITHUB_STEP_SUMMARY"
              answered=no
            fi
          done
          if [ "$answered" = "yes" ]; then
            echo "answer=reachable" >> "$GITHUB_OUTPUT"
            echo "Both products answer at $tag: the full gate runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "answer=absent" >> "$GITHUB_OUTPUT"
            echo "One of the two products does not answer at $tag, so the open" >> "$GITHUB_STEP_SUMMARY"
            echo "distributions cannot be built here and the gate runs reduced." >> "$GITHUB_STEP_SUMMARY"
          fi

  full:
    name: gate (full)
    needs: reachable
    if: needs.reachable.outputs.answer == 'reachable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: demo

      # The two products, at their public names and at the tag the project file pins. NO
      # credential is handed to either checkout: both repositories are public, and a checkout
      # that asked for one would fail on every fork while passing here. The whole history is
      # fetched because the gate reads an archive of a NAMED REF inside the checkout, and the
      # name it is given is that tag.
      - uses: actions/checkout@v5
        with:
          repository: fredaime/sayfirst-control-plane
          ref: v0.3.0
          path: control-plane
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: fredaime/sayfirst-cli
          ref: v0.3.0
          path: client
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"

      - name: gate
        working-directory: demo
        env:
          SAYFIRST_CONTRACT_SOURCE: ${{ github.workspace }}/control-plane
          SAYFIRST_CONTRACT_REF: v0.3.0
          SAYFIRST_CLIENT_SOURCE: ${{ github.workspace }}/client
          SAYFIRST_CLIENT_REF: v0.3.0
        run: |
          status=0
          ./scripts/gate.sh || status=$?
          case "$status" in
            0)
              echo "### gate: full green" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Format, lint and every check ran, including the acceptance suite against" >> "$GITHUB_STEP_SUMMARY"
              echo "a control plane this run started and an approval answered the way a" >> "$GITHUB_STEP_SUMMARY"
              echo "person answers one." >> "$GITHUB_STEP_SUMMARY"
              ;;
            75)
              echo "::error::both products answered at the tag and the gate still came back reduced: a checkout was not there"
              exit 1
              ;;
            *)
              exit "$status"
              ;;
          esac

  reduced:
    name: gate (reduced — the open distributions are absent, some checks not run)
    needs: reachable
    if: needs.reachable.outputs.answer == 'absent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: demo

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"

      # No second checkout: the answer above is that the tag is not there to read, and asking
      # anyway is three minutes of retries ending in a ref that was never found. The source
      # variables are left unset so the gate finds nothing and says so.
      - name: gate (reduced)
        working-directory: demo
        run: |
          set +e
          ./scripts/gate.sh 2>&1 | tee gate.log
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            75)
              headline=$(grep -m1 '^gate: the open distributions are absent:' gate.log | sed 's/^gate: //')
              {
                echo "### gate (reduced): green, and it proves less than a full gate"
                echo ""
                echo "**${headline}**"
                echo ""
                grep '^gate:   not run: ' gate.log | sed 's/^gate:   not run: /- not run: /'
                echo ""
                echo "This run proves that the source is formatted, that it lints, and that the"
                echo "guards reading only this repository's own files hold. It proves nothing"
                echo "about this demonstration against a control plane."
                echo ""
                echo "What would make it full: a runner that can read the two products at the"
                echo "tag this project pins — or the three distributions on an index, which"
                echo "retires both checkouts entirely."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::${headline} — this is a reduced gate, not a full one"
              ;;
            0)
              echo "::error::the gate reported a full run with no source; the reduced job cannot vouch for that"
              exit 1
              ;;
            *)
              exit "$status"
              ;;
          esac

  # Article 15 asks every contributor to sign off each commit, and CONTRIBUTING.md names the
  # script that reads it. It is the one check here that is not `scripts/gate.sh`: it reads
  # the commits of the change against the ref the change started from, and a run on a
  # machine has no such range to be given. The whole history is checked out for the same
  # reason a shallow one is refused — a range that cannot be read answers 2, and 2 is not a
  # pass. It needs no credential, no repository name and no installer: the two refs come
  # from the event, and the script is this repository's own.
  developer-certificate-of-origin:
    name: sign-off on every commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit certifies the Developer Certificate of Origin
        run: >-
          python scripts/check_developer_certificate_of_origin.py
          --base=${{ github.event.pull_request.base.sha }}
          --head=${{ github.event.pull_request.head.sha }}
